name: Build WPR Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download submodules
        run: git submodule update --init --recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Show NDK
        shell: cmd
        run: |
          echo ANDROID_NDK_ROOT=%ANDROID_NDK_ROOT%
          echo ANDROID_NDK_HOME=%ANDROID_NDK_HOME%

      - name: List NDKs
        shell: cmd
        run: |
          dir C:\Android\android-sdk\ndk

      - name: Install Ninja
        run: choco install ninja -y

      - name: Verify Ninja
        shell: cmd
        run: ninja --version

      - name: Clean build directory
        shell: cmd
        run: |
          if exist Source\Build rmdir /s /q Source\Build

      - name: Build libraries
        shell: cmd
        run: |
          .\build.bat
          
      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: android-so
          path: Source/Build/**/*.so
