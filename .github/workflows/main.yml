name: Build WPR Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download submodules
        run: git submodule update --init --recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find sdkmanager
        shell: cmd
        run: |
          dir C:\Android /s /b | findstr sdkmanager.bat

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Install NDK r21e
        shell: cmd
        run: |
          sdkmanager "ndk;21.4.7075529"

      - name: Show NDK
        shell: cmd
        run: |
          echo ANDROID_NDK_ROOT=%ANDROID_NDK_ROOT%
          echo ANDROID_NDK_HOME=%ANDROID_NDK_HOME%

      - name: List NDKs
        shell: cmd
        run: |
          dir C:\Android\android-sdk\ndk

      - name: Install Ninja
        run: choco install ninja -y

      - name: Verify Ninja
        shell: cmd
        run: ninja --version

      - name: Clean build directory
        shell: cmd
        run: |
          if exist Source\Build rmdir /s /q Source\Build

      - name: Build libraries
        shell: cmd
        run: |
          .\build.bat

      - name: Show libraries
        shell: cmd
        run: |
          dir Source\lib /s
          
      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: armeabi-v7a-libs
          path: Source/lib/armeabi-v7a/*.so
